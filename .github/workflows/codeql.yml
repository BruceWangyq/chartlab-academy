name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - id: codeql-analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Private repositories require GitHub Code Security to upload SARIF.
          # Keep the full scan and archive the report without requiring that add-on.
          upload: never
          upload-database: false
      - name: Archive CodeQL SARIF
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: ${{ steps.codeql-analysis.outputs.sarif-output }}
          retention-days: 14
